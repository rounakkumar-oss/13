name: Android APK Build & GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to publish (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if ! (mkdir -p "${SDK_ROOT}/licenses" "${SDK_ROOT}/platforms" "${SDK_ROOT}/build-tools" 2>/dev/null && touch "${SDK_ROOT}/licenses/.wtest" 2>/dev/null && rm -f "${SDK_ROOT}/licenses/.wtest"); then
            SDK_ROOT="${HOME}/android-sdk"
            mkdir -p "${SDK_ROOT}/licenses" "${SDK_ROOT}/platforms" "${SDK_ROOT}/build-tools"
          fi

          SDKMANAGER=""
          for candidate in \
            "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "${SDK_ROOT}/cmdline-tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ] && [ -d "${SDK_ROOT}/cmdline-tools" ]; then
            FOUND=$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND" ] && [ -x "$FOUND" ]; then
              SDKMANAGER="$FOUND"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Downloading Android command-line tools..."
            mkdir -p "${SDK_ROOT}/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d "${SDK_ROOT}/cmdline-tools"
            if [ -d "${SDK_ROOT}/cmdline-tools/cmdline-tools" ]; then
              rm -rf "${SDK_ROOT}/cmdline-tools/latest"
              mv "${SDK_ROOT}/cmdline-tools/cmdline-tools" "${SDK_ROOT}/cmdline-tools/latest"
            fi
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          echo "${SDK_ROOT}/build-tools/36.0.0" >> "$GITHUB_PATH"

          echo "Using sdkmanager: ${SDKMANAGER} (SDK_ROOT=${SDK_ROOT})"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies & build web bundle
        run: |
          npm ci --no-audit --no-fund
          if [ -f src/data/live_world_seed.json ]; then
            cp -f src/data/live_world_seed.json public/world-seed.json
          fi
          test -s public/world-seed.json
          npm run lint
          npm run build
          test -s dist/index.html
          test -s dist/world-seed.json

      - name: Sync Capacitor Android assets
        run: |
          npx cap sync android
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/world-seed.json

      - name: Prepare Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/android/app/release-keystore.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-geminisland}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          else
            PASS="geminislandRelease2026"
            rm -f "$KEYSTORE_PATH"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias geminisland \
              -storepass "$PASS" \
              -keypass "$PASS" \
              -dname "CN=GeminIsland, OU=Game, O=GeminIsland, L=Sydney, S=NSW, C=AU"
            echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${PASS}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=geminisland" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${PASS}" >> "$GITHUB_ENV"
          fi
          test -s "$KEYSTORE_PATH"

      - name: Resolve Release Version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          CLEAN_VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK
        working-directory: android
        run: |
          test -s "$ANDROID_KEYSTORE_PATH"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode="${{ steps.ver.outputs.version_code }}" \
            -PversionName="${{ steps.ver.outputs.version_name }}"

      - name: Verify Signed Release APK
        id: verify_apk
        run: |
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_SRC"
          SIZE=$(stat -c%s "$APK_SRC")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 1000000

          unzip -l "$APK_SRC" | grep -q "AndroidManifest.xml"
          unzip -l "$APK_SRC" | grep -q "classes.dex"
          unzip -l "$APK_SRC" | grep -q "assets/public/index.html"
          unzip -l "$APK_SRC" | grep -q "assets/public/world-seed.json"

          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "$APK_SRC"

          APK_OUT="GeminIsland-${{ steps.ver.outputs.tag }}-release.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "apk_file=${APK_OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminIsland-release-apk
          path: ${{ steps.verify_apk.outputs.apk_file }}
          if-no-files-found: error

      - name: Create GitHub Release & Attach Verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          APK="${{ steps.verify_apk.outputs.apk_file }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$APK" \
              --repo "$REPO" \
              --target "${{ github.sha }}" \
              --title "GeminIsland Android ${TAG}" \
              --notes "Signed release Android APK built and verified automatically from commit ${GITHUB_SHA}."
          fi
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -Fx "$APK"
          echo "Release URL: https://github.com/${REPO}/releases/tag/${TAG}"
          echo "Direct APK URL: https://github.com/${REPO}/releases/download/${TAG}/${APK}"
